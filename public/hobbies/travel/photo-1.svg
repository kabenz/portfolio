<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#80deea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Sea horizon -->
  <rect x="0" y="180" width="400" height="120" fill="#004d40" opacity="0.7"/>
  <!-- Sun -->
  <circle cx="200" cy="130" r="45" fill="#ffee58" opacity="0.95"/>
  <!-- Reflection -->
  <ellipse cx="200" cy="210" rx="50" ry="15" fill="#ffee58" opacity="0.4"/>
  <text x="200" y="268" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">✈️ Sunset View</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b39ddb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4527a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="60" cy="40" r="3" fill="white" opacity="0.8"/>
  <circle cx="130" cy="70" r="2" fill="white" opacity="0.7"/>
  <circle cx="300" cy="30" r="3" fill="white" opacity="0.8"/>
  <circle cx="350" cy="90" r="2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="20" r="4" fill="white" opacity="0.9"/>
  <!-- Mosque / landmark silhouette -->
  <rect x="150" y="150" width="100" height="100" fill="#1a0533" opacity="0.8"/>
  <polygon points="150,150 200,100 250,150" fill="#1a0533" opacity="0.8"/>
  <circle cx="200" cy="95" r="10" fill="#ffcc02"/>
  <rect x="185" y="60" width="30" height="40" fill="#1a0533" opacity="0.8"/>
  <text x="200" y="268" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">✈️ Landmark</text>
</svg>

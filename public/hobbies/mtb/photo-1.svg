<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Mountain background -->
  <polygon points="0,300 120,100 240,300" fill="#1b5e20" opacity="0.7"/>
  <polygon points="160,300 280,80 400,300" fill="#388e3c" opacity="0.7"/>
  <polygon points="80,300 200,50 320,300" fill="#43a047" opacity="0.5"/>
  <!-- Sky -->
  <circle cx="60" cy="50" r="30" fill="#ffee58" opacity="0.9"/>
  <text x="200" y="268" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">🚵 Trail Ride</text>
</svg>
